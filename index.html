<style>
  :root {
    --bg: #0b0c0e;
    --bg-alt: #101216;
    --surface: #15171b;
    --surface-hover: #1b1e23;
    --border: #262930;
    --border-hover: #3d3226;
    --text: #f3f1ec;
    --text-muted: #8b8e94;
    --accent: #cf9d52;
    --accent-soft: rgba(207, 157, 82, 0.14);
    --font-display: "Space Grotesk", "Inter", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: var(--bg);
    display: block;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 5px var(--accent-soft), 0 12px 26px rgba(0, 0, 0, 0.45);
    margin-bottom: 22px;
    animation: revealPhoto 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 25px;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.3;
    animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.32s both;
  }

  .rule {
    width: 26px;
    height: 1px;
    background: var(--accent);
    margin: 16px 0 30px;
    animation: growLine 0.5s ease-out 0.58s both;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 18px;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    transition: border-color 0.15s ease, background-color 0.15s ease;
    animation: riseIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .links .link:nth-child(1) { animation-delay: 0.7s; }
  .links .link:nth-child(2) { animation-delay: 0.8s; }
  .links .link:nth-child(3) { animation-delay: 0.9s; }
  .links .link:nth-child(4) { animation-delay: 1.0s; }
  .links .link:nth-child(5) { animation-delay: 1.1s; }
  .links .link:nth-child(6) { animation-delay: 1.2s; }
  .links .link:nth-child(7) { animation-delay: 1.3s; }

  .link:hover,
  .link:focus-visible {
    border-color: var(--border-hover);
    background: var(--surface-hover);
  }

  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link svg {
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    color: var(--text-muted);
    transition: color 0.15s ease;
  }

  .link:hover svg,
  .link:focus-visible svg {
    color: var(--accent);
  }

  .link .label {
    flex: 1;
  }

  .link .handle {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .link .go {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    opacity: 0;
    transform: translate(-2px, 2px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .link:hover .go,
  .link:focus-visible .go {
    opacity: 1;
    transform: translate(0, 0);
  }

  footer {
    margin-top: 34px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    text-align: center;
    animation: riseInDim 0.5s ease-out 1.45s both;
  }

  @keyframes flashOut {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  @keyframes revealPhoto {
    0% { opacity: 0; transform: scale(0.7); filter: blur(14px); }
    55% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  @keyframes riseIn {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes riseInDim {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 0.55; transform: translateY(0); }
  }

  @keyframes growLine {
    0% { width: 0; opacity: 0; }
    100% { width: 26px; opacity: 0.6; }
  }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle at 50% 38%, rgba(255, 246, 230, 0.95), rgba(207, 157, 82, 0.35) 45%, rgba(11, 12, 14, 0) 75%);
    animation: flashOut 0.65s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    .flash { display: none; }
  }
</style>
</head>

  <script>
    (function () {
      const canvas = document.getElementById("bg");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width, height, dpr;
      let particles = [];
      let mouse = { x: -9999, y: -9999, active: false };
      let time = 0;

      const BG = [11, 12, 14];
      const ACCENT = [207, 157, 82];
      const PARTICLE_COUNT_BASE = 5200;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = `rgb(${BG.join(",")})`;
        ctx.fillRect(0, 0, width, height);
      }

      function seedParticles() {
        const area = width * height;
        const count = Math.min(2200, Math.max(700, Math.round(area / 1000)));
        particles = new Array(count).fill(0).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          life: Math.random() * 200,
          speed: 0.4 + Math.random() * 0.7
        }));
      }

      function flowAngle(x, y, t) {
        const s1 = Math.sin(x * 0.0021 + t * 0.55) + Math.cos(y * 0.0026 - t * 0.4);
        const s2 = Math.sin((x + y) * 0.0014 - t * 0.3);
        const s3 = Math.cos(x * 0.004 - y * 0.003 + t * 0.6);
        return (s1 + s2 * 0.7 + s3 * 0.5) * Math.PI;
      }

      function step() {
        time += 0.9;

        ctx.fillStyle = "rgba(11,12,14,0.04)";
        ctx.fillRect(0, 0, width, height);

        for (const p of particles) {
          let angle = flowAngle(p.x, p.y, time * 0.002);

          if (mouse.active) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            const radius = 190;
            if (dist < radius) {
              const push = (1 - dist / radius) * 1.6;
              angle = Math.atan2(dy, dx) + Math.sin(time * 0.01) * 0.4;
              angle = angle * push + flowAngle(p.x, p.y, time * 0.002) * (1 - push);
            }
          }

          const vx = Math.cos(angle) * p.speed;
          const vy = Math.sin(angle) * p.speed;
          p.x += vx;
          p.y += vy;
          p.life -= 1;

          if (p.x < -20 || p.x > width + 20 || p.y < -20 || p.y > height + 20 || p.life <= 0) {
            p.x = Math.random() * width;
            p.y = Math.random() * height;
            p.life = 140 + Math.random() * 200;
          }

          const mix = (Math.sin(p.x * 0.004 + p.y * 0.004 + time * 0.003) + 1) / 2;
          const r = BG[0] + (ACCENT[0] - BG[0]) * mix;
          const g = BG[1] + (ACCENT[1] - BG[1]) * mix;
          const b = BG[2] + (ACCENT[2] - BG[2]) * mix;

          ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},0.85)`;
          ctx.fillRect(p.x, p.y, 2.6, 2.6);
        }

        requestAnimationFrame(step);
      }

      function drawStaticFallback() {
        const gradient = ctx.createRadialGradient(width * 0.5, height * 0.35, 0, width * 0.5, height * 0.35, Math.max(width, height) * 0.75);
        gradient.addColorStop(0, "rgba(207,157,82,0.10)");
        gradient.addColorStop(1, "rgba(11,12,14,0)");
        ctx.fillStyle = `rgb(${BG.join(",")})`;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      window.addEventListener("resize", () => {
        resize();
        if (reduceMotion) drawStaticFallback(); else seedParticles();
      });
      window.addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
      window.addEventListener("pointerleave", () => { mouse.active = false; });
      window.addEventListener("pointerup", () => { mouse.active = false; });
      window.addEventListener("pointercancel", () => { mouse.active = false; });

      resize();
      if (reduceMotion) {
        drawStaticFallback();
      } else {
        seedParticles();
        requestAnimationFrame(step);
      }
    })();
  </script>
